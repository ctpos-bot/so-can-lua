name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies & build web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../So-can-lua.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: so-can-lua-debug-apk
          path: So-can-lua.apk

      - name: Publish Latest Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sổ Cân Lúa - Bản mới nhất
          files: So-can-lua.apk
          overwrite_existing: true
